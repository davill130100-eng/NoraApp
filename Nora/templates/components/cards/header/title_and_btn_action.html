{% load static %}

<div class="card-header card-hf-shadow bg-black border-bottom border-warning border-opacity-50 d-flex justify-content-between align-items-center">

    <h3 class="fw-bold m-0 text-warning">
        {{ panel_title }}
    </h3>

    {% if not btn_hide %}
        <button
            type="button"
            class="btn btn-sm btn-{{ btn_color|default:'warning' }} btn-oroz shadow-inset-left-bottom hover-lift clicker-btn"
            id="{{ btn_id|default:'btnAction' }}"
        >
            <i class="bi {{ btn_icon|default:'bi-arrow-left' }} me-1"></i>
            {{ btn_text|default:'Volver' }}
        </button>
    {% else %}
        <a class="btn btn-sm btn-{{ btn_color|default:'warning' }} btn-oroz shadow-inset-left-bottom hover-lift clicker-btn"
        id="{{ btn_id|default:'btnAction' }}"
        href="{% url btn_url %}
        ">

        <i class="bi {{ btn_icon|default:'bi-arrow-left' }} me-1"></i>
        {{ btn_text|default:'Volver' }}

        </a>
    {% endif %}

</div>
