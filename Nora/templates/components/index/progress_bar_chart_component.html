{% load static %}

<div class="input-group">

    <span class="label-chart input-group-text text-responsive bg-black text-warning {{ border_class }} {{ text_class }} w-15">
        {{ label }}
    </span>

    <span class="form-control {{ border_class }} bg-black">

        <div class="progress h-100"
             aria-valuenow="{{ value|floatformat:0 }}"
             aria-valuemin="0"
             aria-valuemax="100">

            <div class="progress-bar {{ progress_class }} px-2"
                 style="width: {{ value|floatformat:0 }}%">

                {{ value|floatformat:0 }}%

            </div>

        </div>

    </span>

</div>
