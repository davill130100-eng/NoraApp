{% load static %}

{% block extra_css %}
    <style>
        .bg-icon_selected{
            background-color: var(--warning);
            box-shadow: 
            inset 12px 0 15px -10px rgba(0, 0, 0, 0.8),
            inset -12px 0 15px -10px rgba(0, 0, 0, 0.8) !important;
        }

        .sidebar-icon{
            width: 100%; 
            height: 35px;
        }   

        .sidebar-icon:hover{
            background-color: var(--warning);
            box-shadow: 
            inset 12px 0 15px -10px rgba(0, 0, 0, 0.8),
            inset -12px 0 15px -10px rgba(0, 0, 0, 0.8) !important;
        }
    </style>
{% endblock %}

<a class="
    {% if request.resolver_match.url_name in url_names %}
        bg-icon_selected
    {% endif %}" href="{{ href }}">
    
    <div class="sidebar-icon"
         id="{{ icon_id }}"
         data-path="{{ data_path }}"
         data-bs-toggle="tooltip"
         data-bs-placement="right"
         data-bs-title="{{ title }}">
    </div>
</a>
